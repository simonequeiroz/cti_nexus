# Configurações do Spring Boot (slide 23: "Configura PostgreSQL, JPA e parâmetros JWT").
# ${NOME:padrão} = usa a variável de ambiente NOME; se ela não existir, usa o padrão.
# Assim senha e chave nunca ficam escritas aqui (este arquivo vai para o GitHub). Lista das variáveis: .env.example

spring.application.name=cti-nexus-api

# Lê as variáveis do arquivo backend-java/.env (só no seu PC, nunca vai para o GitHub).
# "optional" = se o arquivo não existir (ex.: no Render), usa as variáveis de ambiente normais.
# Os dois caminhos cobrem rodar de dentro de backend-java ou da raiz do repositório (botão Run do VS Code).
spring.config.import=optional:file:.env[.properties],optional:file:backend-java/.env[.properties]
server.port=8080

# ===== BANCO (PostgreSQL / Neon) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cti_nexus}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:}

# ===== JPA =====
# update: o Hibernate cria/ajusta as tabelas a partir das classes do model/ (bom para estudar; em produção, usar o schema.sql).
spring.jpa.hibernate.ddl-auto=update
# Mostra no terminal o SQL que o JPA gera (ajuda a entender o que o repository faz).
spring.jpa.show-sql=true
# Fecha a conexão com o banco assim que o controller responde (tira um aviso do Spring).
spring.jpa.open-in-view=false

# ===== SEGURANÇA =====
# Desliga o usuário "user" com senha aleatória que o Spring cria sozinho: o nosso login é por JWT.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ===== JWT =====
# Chave secreta que assina os tokens (gerada no PowerShell, slide 26). Sem padrão de propósito: sem chave, o sistema não sobe.
jwt.segredo=${JWT_SECRET_BASE64}
# Quanto tempo o token vale.
jwt.expiracao-minutos=120

# ===== PRIMEIRO ADMINISTRADOR =====
# Criado sozinho (config/DadosIniciais.java) se o banco não tiver nenhum administrador ativo.
# O padrão é o mesmo da demonstração do front; no Render, definir ADMIN_EMAIL e ADMIN_SENHA com valores fortes.
admin.email=${ADMIN_EMAIL:admin@ctinexus.com}
admin.senha=${ADMIN_SENHA:123456}

# ===== CORS =====
# Endereços do front que podem chamar a API (separados por vírgula). Na Vercel, acrescentar o endereço do site.
cors.origens=${CORS_ORIGENS:http://localhost:5173}

# ===== UPLOAD =====
# Mesmo limite do front (constants/validacao.js): até 5 MB. O padrão do Spring é 1 MB.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
